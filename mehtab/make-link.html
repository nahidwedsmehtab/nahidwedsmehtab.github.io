<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Invite Link Maker</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    :root { --wine: #111d52; --wine2: #1a2a6e; --gold: #b98d45; --gold2: #1f2f7a; --ivory: #262c4d; --muted: #8a6a58; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px 60px;
      font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; color: var(--ivory);
      background: radial-gradient(90% 60% at 50% 0%, #fffaf2, transparent 70%), #fdf3e7;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 54px; text-align: center; margin: 0; color: var(--gold2); }
    .sub { text-align: center; color: var(--muted); font-style: italic; margin: 0 0 28px; }
    .card { border: 1px solid rgba(200, 167, 108, .35); border-radius: 16px; padding: 22px; background: #fffaf3; box-shadow: 0 14px 30px -20px rgba(30, 40, 90, .5); }
    label { display: block; font-family: Cinzel, serif; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 18px 0 8px; }
    label:first-child { margin-top: 0; }
    input[type=text], textarea {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(200, 167, 108, .4);
      background: #fff; color: var(--ivory); font: inherit; font-size: 18px;
    }
    textarea { min-height: 120px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--gold2); outline-offset: 1px; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg span { height: 100%; display: flex !important; align-items: center; justify-content: center; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg span {
      display: block; text-align: center; padding: 12px 8px; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(200, 167, 108, .4); font-family: Cinzel, serif; font-size: 13px; letter-spacing: .08em;
    }
    .seg input:checked + span { background: linear-gradient(120deg, #1a2a6e, #2a3f96 50%, #1a2a6e); color: #f8ead4; border-color: transparent; }
    .seg input:focus-visible + span { outline: 2px solid var(--gold2); outline-offset: 2px; }
    .out { word-break: break-all; padding: 12px 14px; border-radius: 10px; background: #fff; border: 1px dashed rgba(200, 167, 108, .45); font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: var(--gold2); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button, .btn {
      flex: 1 1 160px; display: inline-flex; justify-content: center; align-items: center; min-height: 46px; padding: 10px 16px;
      border-radius: 999px; border: 1px solid rgba(200, 167, 108, .55); background: transparent;
      color: var(--gold2); font-family: Cinzel, serif; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none;
    }
    .primary { background: linear-gradient(120deg, #1a2a6e, #2a3f96 50%, #1a2a6e); color: #f8ead4; border-color: transparent; }
    .note { color: var(--muted); font-size: 16px; font-style: italic; margin-top: 10px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--wine); color: #f8ead4; padding: 8px 18px; border-radius: 999px; font-family: Cinzel, serif; font-size: 12px; opacity: 0; transition: opacity .3s; }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>
<main>
  <h1>Invite Link Maker</h1>
  <p class="sub">Make a personal invitation link for each guest. Groom’s side (Khan Family). This page is just for the family.</p>

  <div class="card">
    <label for="name">Guest name (shown on the scroll)</label>
    <input id="name" type="text" placeholder="e.g. Siddiqui Family" autocomplete="off">

    <label>Which invitation?</label>
    <div class="seg" role="radiogroup">
      <label style="margin:0"><input type="radio" name="v" value="reception" checked><span>Reception</span></label>
      <label style="margin:0"><input type="radio" name="v" value="baraat"><span>Baraat + Reception</span></label>
    </div>

    <label>Link</label>
    <div class="out" id="out"></div>

    <label for="msg">WhatsApp message</label>
    <textarea id="msg"></textarea>

    <div class="row">
      <button type="button" id="copy">Copy link</button>
      <a class="btn primary" id="wa" href="#" target="_blank" rel="noopener">Send on WhatsApp</a>
    </div>
    <p class="note">Tip: leave the name empty for a general link you can post in groups.</p>
  </div>
</main>
<div class="toast" id="toast">Copied</div>
<script>
(() => {
  const base = location.href.replace(/make-link\.html.*$/, '').replace(/[?#].*$/, '');
  const $ = (id) => document.getElementById(id);
  let edited = false;
  function link() {
    const p = new URLSearchParams();
    const n = $('name').value.trim();
    if (document.querySelector('input[name=v]:checked').value === 'baraat') p.set('baraat', '');
    if (n) p.set('to', n);
    const q = p.toString().replace('baraat=', 'baraat');
    return base + (q ? '?' + q : '');
  }
  function defaultMsg(url) {
    const n = $('name').value.trim();
    const baraat = document.querySelector('input[name=v]:checked').value === 'baraat';
    return `Assalamu Alaikum${n ? ' ' + n : ''}!\n\nWith the blessings of Allah (SWT), the Khan Family warmly invites you to the wedding celebrations of Mehtab Khan & Nahid:\n\n${baraat ? '• Baraat — Saturday, 2nd January 2027, 7:00 PM\n' : ''}• Reception — Wednesday, 6th January 2027, 1:00 PM\n\nPlease open your invitation:\n${url}\n\n— Khan Family`;
  }
  function update() {
    const url = link();
    $('out').textContent = url;
    if (!edited) $('msg').value = defaultMsg(url);
    else $('msg').value = $('msg').value.replace(/https?:\/\/\S+/, url);
    $('wa').href = 'https://wa.me/?text=' + encodeURIComponent($('msg').value);
  }
  $('name').addEventListener('input', update);
  document.querySelectorAll('input[name=v]').forEach((r) => r.addEventListener('change', update));
  $('msg').addEventListener('input', () => { edited = true; $('wa').href = 'https://wa.me/?text=' + encodeURIComponent($('msg').value); });
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(link()); } catch (e) { prompt('Copy this link:', link()); return; }
    $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1600);
  });
  update();
})();
</script>
</body>
</html>
